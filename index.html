<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompetePulse | AI Tracker</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#060913">
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Enables manual Light/Dark class toggling
        tailwind.config = { darkMode: 'class' }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="antialiased transition-colors duration-300 bg-slate-50 dark:bg-[#060913] text-slate-900 dark:text-white">
    <div id="app" class="min-h-screen flex flex-col md:flex-row relative overflow-x-hidden">
        
        <aside id="sidebar" class="w-full md:w-64 border-r border-slate-200 dark:border-slate-800/50 flex flex-col justify-between shrink-0 z-30 transition-all duration-300 bg-white dark:bg-[#050810]">
            <div class="flex-1 flex flex-col">
                <div class="p-5 md:p-6 flex items-center justify-center border-b border-slate-200 dark:border-slate-800/80 bg-slate-50 dark:bg-[#020408]">
                    <div class="flex items-center gap-2.5">
                        <div class="bg-gradient-to-br from-indigo-500 to-purple-600 p-2 rounded-xl shadow-lg">
                            <i data-lucide="activity" class="w-5 h-5 text-white"></i>
                        </div>
                        <h1 class="text-2xl font-outfit font-extrabold tracking-tight">Compete<span class="text-indigo-500">Pulse</span></h1>
                    </div>
                </div>

                <nav class="p-3 md:p-4 space-y-2 flex flex-row md:flex-col justify-around md:justify-start">
                    <button data-view="dashboard" class="nav-btn active flex-1 md:w-full flex items-center justify-center md:justify-between px-3 md:px-4 py-3 rounded-xl font-semibold text-xs md:text-sm transition-all bg-indigo-500/10 text-indigo-600 dark:text-indigo-400">
                        <div class="flex items-center gap-2 md:gap-3"><i data-lucide="layout-dashboard" class="w-4 h-4 md:w-5 md:h-5"></i><span class="hidden sm:inline">Dashboard</span><span class="sm:hidden">Dash</span></div>
                    </button>
                    <button data-view="todos" class="nav-btn flex-1 md:w-full flex items-center justify-center md:justify-between px-3 md:px-4 py-3 rounded-xl font-semibold text-xs md:text-sm transition-all hover:bg-indigo-500/10 text-slate-500 hover:text-indigo-600 dark:text-slate-300 dark:hover:text-indigo-400">
                        <div class="flex items-center gap-2 md:gap-3"><i data-lucide="check-square" class="w-4 h-4 md:w-5 md:h-5"></i><span class="hidden sm:inline">Reminders</span><span class="sm:hidden">Tasks</span></div>
                    </button>
                </nav>
            </div>
            
            <!-- NEW THEME SWITCHER -->
            <div class="p-4 border-t border-slate-200 dark:border-slate-800 hidden md:block">
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 block">UI Theme</label>
                <div class="flex gap-1 bg-slate-100 dark:bg-[#04070f] p-1 rounded-xl border border-slate-200 dark:border-slate-800">
                    <button data-theme="light" class="theme-btn flex-1 py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5 transition-all text-slate-500 dark:text-slate-400"><i data-lucide="sun" class="w-3.5 h-3.5"></i> Light</button>
                    <button data-theme="dark" class="theme-btn flex-1 py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5 transition-all text-slate-500 dark:text-slate-400"><i data-lucide="moon" class="w-3.5 h-3.5"></i> Dark</button>
                    <button data-theme="auto" class="theme-btn flex-1 py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5 transition-all text-slate-500 dark:text-slate-400"><i data-lucide="monitor" class="w-3.5 h-3.5"></i> Auto</button>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
            <header class="sticky top-0 z-20 bg-white/90 dark:bg-[#060913]/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800/50 px-4 md:px-6 py-4 flex items-center justify-between">
                <h2 id="header-title" class="text-lg md:text-xl font-outfit font-bold">Dashboard</h2>
                <button id="btn-add-comp" class="flex items-center gap-2 px-3 md:px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs md:text-sm shadow-lg transition-all">
                    <i data-lucide="plus" class="w-4 h-4"></i><span>Manual</span>
                </button>
            </header>

            <div class="p-4 md:p-6 flex-1 max-w-7xl w-full mx-auto space-y-6 md:space-y-8">
                <section id="view-dashboard" class="view-section space-y-6 md:space-y-8">
                    <!-- AI Hero Area -->
                    <div class="relative overflow-hidden rounded-2xl md:rounded-3xl bg-indigo-50 dark:bg-gradient-to-r dark:from-indigo-950/80 dark:to-[#0a0f1f] border border-indigo-200 dark:border-indigo-500/30 p-5 md:p-8 space-y-4 md:space-y-5">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-indigo-200 dark:border-indigo-500/20 pb-4">
                            <div>
                                <h2 class="font-outfit text-xl md:text-3xl font-extrabold tracking-tight flex items-center gap-2">
                                    <i data-lucide="sparkles" class="text-indigo-500 dark:text-indigo-400 w-5 h-5 md:w-6 md:h-6"></i> AI Event Scanner
                                </h2>
                            </div>
                            <button id="btn-open-api-key-modal" class="px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs font-semibold flex items-center justify-center gap-2 shrink-0">
                                <i data-lucide="key" class="w-3 h-3 text-amber-500 dark:text-amber-400"></i>
                                <span id="api-key-status-label" class="text-slate-600 dark:text-slate-300">API Key</span>
                            </button>
                        </div>
                        <div class="flex flex-col sm:flex-row items-stretch gap-3">
                            <div class="relative flex-1">
                                <i data-lucide="link" class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-indigo-500"></i>
                                <input type="url" id="magic-url-input" placeholder="Paste Unstop URL..." class="w-full bg-white dark:bg-[#04070f] border border-slate-300 dark:border-slate-700 focus:border-indigo-500 text-sm md:text-base rounded-xl pl-12 pr-4 py-3.5 outline-none transition-all">
                            </div>
                            <button id="btn-magic-extract" class="px-6 py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-lg flex items-center justify-center gap-2 shrink-0">
                                <i data-lucide="scan-line" class="w-4 h-4"></i><span>Extract Data</span>
                            </button>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <h3 class="font-outfit font-bold text-lg md:text-xl flex items-center gap-2">
                            <i data-lucide="trophy" class="w-5 h-5 text-amber-500 dark:text-amber-400"></i> Active Tracks
                        </h3>
                        <div id="dashboard-cards-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6"></div>
                    </div>
                </section>

                <section id="view-todos" class="view-section hidden space-y-6">
                    <div class="bg-white dark:bg-[#0a0f1f] p-4 md:p-5 rounded-2xl md:rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm">
                        <h3 class="font-outfit font-bold text-lg mb-4 flex items-center gap-2">
                            <i data-lucide="bell" class="w-5 h-5 text-indigo-500 dark:text-indigo-400"></i> New Reminder
                        </h3>
                        <form id="form-todo" class="flex flex-col gap-3">
                            <input type="text" id="todo-text" required placeholder="E.g., Submit presentation..." class="w-full bg-slate-50 dark:bg-[#04070f] border border-slate-300 dark:border-slate-700 focus:border-indigo-500 rounded-xl px-4 py-3 outline-none text-sm">
                            
                            <div class="flex flex-row gap-2 w-full">
                                <div class="relative flex-1">
                                    <span class="absolute text-[10px] font-bold -top-2 left-3 bg-white dark:bg-[#0a0f1f] px-1 text-slate-500 dark:text-slate-400 pointer-events-none">Date</span>
                                    <input type="date" id="todo-date" onclick="if(this.showPicker) this.showPicker();" class="w-full bg-slate-50 dark:bg-[#04070f] border border-slate-300 dark:border-slate-700 focus:border-indigo-500 rounded-xl px-3 py-3 outline-none text-xs md:text-sm cursor-pointer">
                                </div>
                                <div class="relative flex-1">
                                    <span class="absolute text-[10px] font-bold -top-2 left-3 bg-white dark:bg-[#0a0f1f] px-1 text-slate-500 dark:text-slate-400 pointer-events-none">Time</span>
                                    <input type="time" id="todo-time" onclick="if(this.showPicker) this.showPicker();" class="w-full bg-slate-50 dark:bg-[#04070f] border border-slate-300 dark:border-slate-700 focus:border-indigo-500 rounded-xl px-3 py-3 outline-none text-xs md:text-sm cursor-pointer">
                                </div>
                            </div>
                            
                            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 px-6 py-3 rounded-xl text-white font-bold text-sm shadow-lg shrink-0 mt-1">Save Task</button>
                        </form>
                    </div>
                    <div class="space-y-3">
                        <h4 class="font-bold text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider pl-1">Your Pending Tasks</h4>
                        <div id="todo-list-container" class="space-y-3"></div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="modal-api-key" class="fixed inset-0 bg-slate-900/60 dark:bg-[#060913]/90 backdrop-blur-sm z-[100] flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-[#0a0f1f] border border-slate-200 dark:border-indigo-500/40 rounded-3xl w-full max-w-md flex flex-col shadow-2xl">
            <div class="px-5 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                <h3 class="font-outfit font-bold flex items-center gap-2"><i data-lucide="key" class="w-4 h-4 text-amber-500"></i><span>Gemini Config</span></h3>
                <button id="btn-close-api-key-modal" class="p-2 text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-5 space-y-4">
                <input type="password" id="input-gemini-api-key" placeholder="AIzaSy..." class="w-full bg-slate-50 dark:bg-[#04070f] border border-slate-300 dark:border-slate-800 text-sm rounded-xl px-4 py-3 outline-none font-mono">
                <div class="flex justify-end gap-2">
                    <button id="btn-clear-api-key" class="px-4 py-2 text-rose-500 text-sm font-semibold">Clear</button>
                    <button id="btn-save-api-key" class="px-5 py-2 rounded-xl bg-indigo-600 text-white text-sm font-bold">Save Key</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-comp" class="fixed inset-0 bg-slate-900/60 dark:bg-[#060913]/90 backdrop-blur-sm z-[90] flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-[#0a0f1f] border border-slate-200 dark:border-slate-800 rounded-3xl w-full max-w-lg flex flex-col shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="px-5 py-4 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center sticky top-0 bg-white dark:bg-[#0a0f1f] z-10">
                <h3 class="font-bold font-outfit">Save Tracker Data</h3>
                <button id="btn-close-modal" class="text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form id="form-comp" class="p-5 space-y-4">
                <div>
                    <label class="text-[11px] text-slate-500 dark:text-slate-400 font-bold mb-1 block uppercase tracking-wide">Competition Title</label>
                    <input type="text" id="comp-title" required class="w-full bg-slate-50 dark:bg-[#04070f] border border-slate-300 dark:border-slate-800 text-sm rounded-xl px-4 py-3 outline-none">
                </div>
                <div>
                    <label class="text-[11px] text-slate-500 dark:text-slate-400 font-bold mb-1 block uppercase tracking-wide">Short Summary</label>
                    <textarea id="comp-description" rows="2" class="w-full bg-slate-50 dark:bg-[#04070f] border border-slate-300 dark:border-slate-800 text-xs rounded-xl px-4 py-2 outline-none"></textarea>
                </div>
                <div>
                    <label class="text-[11px] text-slate-500 dark:text-slate-400 font-bold mb-1 block uppercase tracking-wide">Hard Deadline</label>
                    <input type="datetime-local" id="comp-sub-deadline" onclick="if(this.showPicker) this.showPicker();" required class="w-full bg-slate-50 dark:bg-[#04070f] border border-slate-300 dark:border-slate-800 text-sm rounded-xl px-4 py-3 outline-none">
                </div>
                <div>
                    <label class="text-[11px] text-slate-500 dark:text-slate-400 font-bold mb-1 block uppercase tracking-wide">Live Link</label>
                    <input type="url" id="comp-url" class="w-full bg-slate-50 dark:bg-[#04070f] border border-slate-300 dark:border-slate-800 text-sm rounded-xl px-4 py-3 outline-none">
                </div>
                <button type="submit" class="w-full mt-2 px-6 py-3.5 rounded-xl bg-indigo-600 text-white font-bold text-sm">Save to Dashboard</button>
            </form>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
    <script src="app.js"></script>
</body>
</html>
